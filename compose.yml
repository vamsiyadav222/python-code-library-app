
services:
  auth:
    image: vamsimattepu123/python-app-1:latest
    container_name: auth
    ports:
      - "5001:5000"
    restart: unless-stopped

  book:
    image: vamsimattepu123/python-app-2:latest
    container_name: book
    ports:
      - "5002:5000"
    restart: unless-stopped

  borrow:
    image: vamsimattepu123/python-app-3:latest
    container_name: borrow
    ports:
      - "5003:5000"
    restart: unless-stopped

  db:
    container_name: db
    image: vamsimattepu123/python-app-4:latest
    ports:
     - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    restart: unless-stopped

  frontend:
    image: vamsimattepu123/python-app-5:latest
    container_name: frontend
    ports:
      - "5000:5000"
    restart: unless-stopped

volumes:
  mysql_data:
