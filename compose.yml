
services:
  auth_service:
    image: vamsimattepu123/python-app-1:latest
    container_name: auth_service
    ports:
      - "5555:5000"
    restart: unless-stopped

  book_service:
    image: vamsimattepu123/python-app-2:latest
    container_name: book_service
    ports:
      - "5556:5000"
    restart: unless-stopped

  borrow_service:
    image: vamsimattepu123/python-app-3:latest
    container_name: borrow
    ports:
      - "5557:5000"
    restart: unless-stopped

  db:
    container_name: db
    image: vamsimattepu123/python-app-4:latest
    ports:
     - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    restart: unless-stopped

  frontend:
    image: vamsimattepu123/python-app-5:latest
    container_name: frontend
    ports:
      - "5000:5000"
    restart: unless-stopped

volumes:
  mysql_data:
